<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <script src="https://d3js.org/d3.v4.min.js"></script>
    <style>
    
        #graph {
            width: 960px;
            height: 400px;
            margin: 0 auto;
            overflow: visible;
            padding: 10px;
            border: dotted 1px rgb(125,0,0,0.3);
        }

        .axis line,
        .axis path {
            fill: none;
            stroke: #9e9e9e;
            shape-rendering: crispEdges;
        }
        
        circle{
            stroke: none;
            fill: red;
        }
        
        svg{
            overflow:inherit;
        }
    </style>
</head>

<body>

    <div id="graph"></div>

    <script>
        
        var data = [
  {
    "x": 0,
    "y": 16
  },
  {
    "x": 1,
    "y": -23
  },
  {
    "x": 2,
    "y": -34
  },
            {
    "x": 3,
    "y": 25
  }
]
        
        var svg = d3.select('#graph').append('svg')
            .attr('width', 960)
            .attr('height', 400)

        var t = d3.transition()
            .duration(800)
            .ease(d3.easeLinear)
            .delay((d, i) => i * 1000);

        var xScale = d3.scaleLinear()
            .domain([0, 10])
            .range([0, 800])
        var yScale = d3.scaleLinear()
            .domain([100, -100])
            .range([0, 400])

        const xAxis = d3.axisBottom(xScale)
            .tickPadding(10);
        const yAxis = d3.axisLeft(yScale)
            .tickPadding(10);

        svg.append('g')
            .attr('transform', 'translate(0, 0)')
            .attr('class', 'y axis')
            .call(yAxis);
        
        svg.append('g')
            .attr('transform', 'translate(0,' + yScale(0) + ')')
            .attr('class', 'x axis')
            .call(xAxis);
        
        svg.selectAll("circle")
                .attr("class", "points")
                .data(data)
                .enter().append("circle")
                .attr("cx", function(d) {
                    return xScale(d.x);
                })
                .attr("cy", function(d) {
                    return yScale(d.y);
                })
                .attr("r", 2);

        d3.interval(update, 1000);
        
        function update() {
            yScale.domain([Math.floor(Math.random() * (100)), Math.floor(Math.random() * -(100))])

            svg.select('.y')
                .transition(t)
                .call(yAxis);
                
            svg.select('.x')
                .transition(t)
                .attr('transform', 'translate(0,' + yScale(0) + ')')
                .call(xAxis);
            
            svg.selectAll("circle")
                .transition(t)
                .attr("cy", function(d) {
                    return yScale(d.y);
                });
        }    
        
    </script>
</body>
